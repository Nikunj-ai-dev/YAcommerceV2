[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Auth endpoints
[[redirects]]
  from = "/api/auth/email/send-otp"
  to = "/.netlify/functions/auth-email-send-otp"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/email/verify-otp"
  to = "/.netlify/functions/auth-email-verify-otp"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/phone/send-otp"
  to = "/.netlify/functions/auth-phone-send-otp"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/phone/verify-otp"
  to = "/.netlify/functions/auth-phone-verify-otp"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/google/callback"
  to = "/.netlify/functions/auth-google-callback"
  status = 200
  force = true

# Payment endpoints
[[redirects]]
  from = "/api/payment/create-order"
  to = "/.netlify/functions/payment-create-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/payment/verify"
  to = "/.netlify/functions/payment-verify"
  status = 200
  force = true

# Order endpoints
[[redirects]]
  from = "/api/order/create"
  to = "/.netlify/functions/order-create"
  status = 200
  force = true

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]
