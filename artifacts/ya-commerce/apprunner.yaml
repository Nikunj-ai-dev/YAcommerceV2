version: 1.0

# AWS App Runner configuration for YA Commerce
# Unified deployment: Express server serves both API and static frontend

runtime: nodejs20

build:
  commands:
    pre-build:
      - echo "Node version:" && node --version
      - echo "NPM version:" && npm --version
      - echo "Installing dependencies..."
      - npm install
    build:
      - echo "Building client and server..."
      - npm run build
    post-build:
      - echo "Build completed"
      - ls -la dist/
      - ls -la server/dist/

run:
  runtime-version: 20
  command: node server/dist/index.js
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    # Server-side environment variables (set these in AWS App Runner console)
    # - name: SUPABASE_URL
    #   value: "your-supabase-url"
    # - name: SUPABASE_SERVICE_ROLE_KEY
    #   value: "your-service-role-key"
    # - name: RAZORPAY_KEY_ID
    #   value: "your-razorpay-key-id"
    # - name: RAZORPAY_KEY_SECRET
    #   value: "your-razorpay-key-secret"
    # - name: BREVO_API_KEY
    #   value: "your-brevo-api-key"
    # - name: GOOGLE_CLIENT_ID
    #   value: "your-google-client-id"
    # - name: GOOGLE_CLIENT_SECRET
    #   value: "your-google-client-secret"
